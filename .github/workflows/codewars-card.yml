name: Update Codewars Card

on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate Codewars card
        run: |
          python <<'PY'
          import html
          import json
          import os
          import urllib.request

          USERNAME = "albertdirksenDev"

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GitHub-Actions-Codewars-Card"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          profile = get_json(
              f"https://www.codewars.com/api/v1/users/{USERNAME}"
          )
          completed = get_json(
              f"https://www.codewars.com/api/v1/users/{USERNAME}/code-challenges/completed?page=0"
          )

          rank = profile.get("ranks", {}).get("overall", {}).get("name", "—")
          honor = profile.get("honor", "—")
          leaderboard = profile.get("leaderboardPosition")
          leaderboard = f"#{leaderboard}" if leaderboard else "—"
          completed_count = completed.get("totalItems", "—")
          clan = profile.get("clan") or "No clan"

          username = html.escape(str(profile.get("username", USERNAME)))
          rank = html.escape(str(rank))
          honor = html.escape(str(honor))
          leaderboard = html.escape(str(leaderboard))
          completed_count = html.escape(str(completed_count))
          clan = html.escape(str(clan))

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0d1117"/>
                <stop offset="100%" stop-color="#161b22"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect x="1" y="1" width="798" height="218" rx="18"
                  fill="url(#bg)" stroke="#b1362f" stroke-width="2"/>

            <circle cx="72" cy="70" r="34" fill="#b1362f"/>
            <text x="72" y="79" text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="28" font-weight="700" fill="#ffffff">CW</text>

            <text x="125" y="58"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="31" font-weight="700" fill="#f0f6fc">Codewars</text>

            <text x="125" y="91"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="21" fill="#8b949e">{username}</text>

            <rect x="620" y="38" width="135" height="58" rx="12"
                  fill="#11161d" stroke="#f04438" stroke-width="3"
                  filter="url(#glow)"/>
            <text x="687" y="75" text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="28" font-weight="700" fill="#f04438">{rank}</text>

            <line x1="40" y1="118" x2="760" y2="118" stroke="#30363d"/>

            <text x="55" y="151" font-family="Arial, Helvetica, sans-serif"
                  font-size="14" fill="#8b949e">Completed Kata</text>
            <text x="55" y="181" font-family="Arial, Helvetica, sans-serif"
                  font-size="25" font-weight="700" fill="#f0f6fc">{completed_count}</text>

            <text x="245" y="151" font-family="Arial, Helvetica, sans-serif"
                  font-size="14" fill="#8b949e">Honor</text>
            <text x="245" y="181" font-family="Arial, Helvetica, sans-serif"
                  font-size="25" font-weight="700" fill="#f0f6fc">{honor}</text>

            <text x="395" y="151" font-family="Arial, Helvetica, sans-serif"
                  font-size="14" fill="#8b949e">Leaderboard</text>
            <text x="395" y="181" font-family="Arial, Helvetica, sans-serif"
                  font-size="25" font-weight="700" fill="#f0f6fc">{leaderboard}</text>

            <text x="585" y="151" font-family="Arial, Helvetica, sans-serif"
                  font-size="14" fill="#8b949e">Clan</text>
            <text x="585" y="181" font-family="Arial, Helvetica, sans-serif"
                  font-size="18" font-weight="600" fill="#f0f6fc">{clan}</text>
          </svg>"""

          os.makedirs("assets", exist_ok=True)
          with open("assets/codewars-card.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit card if changed
        run: |
          git config user.name "AlbertDirksen15"
          git config user.email "50892399+AlbertDirksen15@users.noreply.github.com"
          git add assets/codewars-card.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update Codewars profile card"
          git push origin main
